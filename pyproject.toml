[project]
name = "media-rag-bench"
version = "0.1.0"
description = "A reproducible direct-LLM versus RAG recommendation benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
media-rag-bench = "media_rag_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"
module-name = "media_rag_bench"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
